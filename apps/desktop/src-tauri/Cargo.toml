[package]
name = "dropvoice-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DropVoice desktop backend — voice-to-text from mobile to PC"

[lib]
name = "dropvoice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

tokio = { workspace = true }

enigo = "0.6"
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
local-ip-address = { workspace = true }
# 迁移自 `dirs`：与 pairing-server 统一使用 `directories` crate（workspace 已声明），
# 避免同一 workspace 维护两个功能重叠的路径解析 crate。
directories = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
# dvct_ 连接令牌编码（webrtc-scan-direct-design §3.3，URL_SAFE_NO_PAD 32 字节）。
base64 = { workspace = true }
# 信令 + WebRTC 应答面（Rust 常驻子系统，见 network/signaling.rs、webrtc/）。
webrtc = { workspace = true }
eventsource-stream = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
