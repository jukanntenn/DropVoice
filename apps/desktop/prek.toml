# apps/desktop — TS frontend (src/) + Tauri Rust backend (src-tauri/).
# Workspace mode runs these hooks with cwd=apps/desktop (where package.json
# lives) and strips the apps/desktop/ prefix, so package scripts resolve and
# per-file formatting works via `prek run --group format --files <path>`.
# Root builtins (trailing-whitespace, check-yaml, ...) still cover these files.

[[repos]]
repo = "local"

# ---- format group: mutating fixers ----
[[repos.hooks]]
id = "prettier"
name = "prettier (desktop)"
language = "system"
entry = "pnpm exec prettier --write"
files = "\\.(ts|tsx|js|jsx|json|css|html)$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "oxlint-fix"
name = "oxlint --fix (desktop)"
language = "system"
entry = "pnpm exec oxlint --fix"
files = "\\.(ts|tsx|js|jsx)$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "rustfmt"
name = "cargo fmt (desktop)"
language = "system"
entry = "cargo fmt --manifest-path src-tauri/Cargo.toml --"
files = "\\.rs$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: read-only gates ----
[[repos.hooks]]
id = "oxlint"
name = "oxlint (desktop)"
language = "system"
entry = "pnpm exec oxlint"
files = "\\.(ts|tsx|js|jsx)$"
pass_filenames = true
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "tsc --noEmit (desktop)"
language = "system"
entry = "pnpm typecheck"
files = "\\.(ts|tsx)$"
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "clippy"
name = "cargo clippy (desktop)"
language = "system"
entry = "cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings"
files = "\\.rs$"
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

# ---- check group: tests (pre-push) ----
[[repos.hooks]]
id = "vitest"
name = "vitest (desktop)"
language = "system"
entry = "pnpm test"
files = "\\.(ts|tsx)$"
pass_filenames = false
groups = ["check"]
stages = ["pre-push"]

[[repos.hooks]]
id = "cargo-test"
name = "cargo test (desktop)"
language = "system"
entry = "cargo test --manifest-path src-tauri/Cargo.toml"
files = "\\.rs$"
pass_filenames = false
groups = ["check"]
stages = ["pre-push"]
