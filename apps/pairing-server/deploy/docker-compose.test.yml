# 本地 e2e/压测环境（spec 11 §13.1）。
# 与生产完全同构：Caddy + axum + SQLite，唯一差异是 TLS 证书（自签）。
#
# 运行：
#   docker compose -f deploy/docker-compose.test.yml up -d
#   k6 run tests/load/register.js -e BASE_URL=https://localhost:8443
#   docker compose -f deploy/docker-compose.test.yml down -v

services:
  pairing-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      LISTEN_ADDR: "0.0.0.0:38424"
      DATABASE_URL: "sqlite:///data/pairing.db?mode=rwc"
      LOG_DIR: "/data/logs"
      RUST_LOG: "info,dropvoice_pairing_server=debug"
    volumes:
      - pairing-data:/data
    # 容器内通信，仅暴露给 caddy
    expose:
      - "38424"

  caddy:
    image: caddy:2.11
    depends_on:
      - pairing-server
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile.test:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pairing-data:
  caddy-data:
  caddy-config:
