# DropVoice pairing-server — Docker Compose Quick Start (self-hosted, HTTP)
#
# 1. Copy the app config:   cp config.example.toml config.toml   (edit if needed)
# 2. (Optional) host port:  cp .env.example .env                 (defaults are fine)
# 3. docker compose up -d
# 4. curl http://localhost:8080/health   # -> "ok"
#
# Topology (mirrors markpost's production mechanism, adapted for SQLite):
#   - All services in ONE container: s6-overlay supervises Caddy (the only
#     published port) + the Rust axum backend (loopback-only :38424).
#   - The SQLite database lives in the dropvoice-data named volume at
#     /app/data — visible only to this container, never published on the host.
#   - Rolling JSON logs are bind-mounted to ./log for host visibility.
#
# Application config (rate limit / docs / CORS) lives in ./config.toml
# (template: config.example.toml), mounted at /app/config.toml — this compose
# only keeps host-side concerns: PAIRING_PORT and RUST_LOG (see .env.example).

services:
  dropvoice-pairing:
    # Public images on Docker Hub (CI publishes on every v* tag; `latest`
    # tracks the newest stable release). Also on ghcr.io.
    image: docker.io/jukanntenn/dropvoice-pairing-server:latest
    container_name: dropvoice-pairing
    ports:
      - "${PAIRING_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config.toml:/app/config.toml:ro
      - ./log:/app/log
      - dropvoice-data:/app/data
    environment:
      - LOG_DIR=/app/log
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "--no-verbose",
          "--tries=1",
          "http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  dropvoice-data:
