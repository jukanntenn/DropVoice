# DropVoice pairing-server — Docker Compose Quick Start (self-hosted, HTTP)
#
# 1. Copy .env.example to .env and edit the values
# 2. docker compose up -d
# 3. curl http://localhost:8080/health   # -> "ok"
#
# Topology (mirrors markpost's production mechanism, adapted for SQLite):
#   - All services in ONE container: s6-overlay supervises Caddy (the only
#     published port) + the Rust axum backend (loopback-only :38424).
#   - The SQLite database lives in the dropvoice-data named volume at
#     /app/data — visible only to this container, never published on the host.
#     (markpost runs a sibling postgres over a Unix-socket volume; this
#     project uses embedded SQLite, so the data volume plays the sibling's
#     role with the same isolation semantics.)
#   - Rolling JSON logs are bind-mounted to ./log for host visibility.
#
# Environment variables (optional):
#   PAIRING_PORT   - Host port (default: 8080)
#   RUST_LOG       - Log level (default: info)
#   RATE_LIMIT_PER_SEC - Per-IP requests/sec (default: 1)

services:
  dropvoice-pairing:
    # Available tags: latest, v* (registry pushed via docker/build.py)
    image: dropvoice/pairing-server:latest
    container_name: dropvoice-pairing
    ports:
      - "${PAIRING_PORT:-8080}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./log:/app/log
      - dropvoice-data:/app/data
    environment:
      - LISTEN_ADDR=127.0.0.1:38424
      - DATABASE_URL=sqlite:///app/data/pairing.db?mode=rwc
      - LOG_DIR=/app/log
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "--no-verbose",
          "--tries=1",
          "http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  dropvoice-data:
