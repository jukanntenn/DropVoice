# dropvoice ansible-runner — 集合版本锁定。
#
# 仅作可审计的版本来源。实际安装在 Dockerfile 构建时由
# `ansible-galaxy collection install` 完成（见 Dockerfile）。改版本时同步
# 修改 Dockerfile 里的 pin 值，然后重新 docker build。

collections:
  - name: community.docker
    # deploy.yml 用到 community.docker.docker_compose_v2 模块。
    # 5.2.1 要求 ansible-core >=2.17，Dockerfile pin 2.18.* 满足。
    version: "==5.2.1"
