# dropvoice ansible-runner — 容器内 ansible 配置。
#
# 此文件通过 Dockerfile 的 ANSIBLE_CONFIG 环境变量在容器内生效。
# 与 devops/ansible/ansible.cfg（供 Linux/Mac 用户本地直跑 ansible 使用）解耦，
# 互不干扰：此文件追加容器专属项（host_key_checking、timeout 等），那一份保持
# Linux 本地原貌不动。

[defaults]
callback_result_format = yaml
callback_result_indentation = 2

# 容器专属：容器无 known_hosts，首次连接目标主机不卡交互。
host_key_checking = False

# 网络抖动容忍（容器跨 NAT 连 VPS 时尤其需要）。
timeout = 30

# 不在挂载的仓库卷里留 .retry 文件（避免污染 git 工作区）。
retry_files_enabled = False
