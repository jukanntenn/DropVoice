---
# dropvoice pairing-server unified deployment playbook.
#
# A single playbook serves staging / production. The target environment is
# selected with --limit (mandatory), and per-environment differences live in
# group_vars/<env>.yml. Run via devops/deploy.py (Windows: dockerized ansible
# runner):
#
#   python apps/pairing-server/devops/deploy.py staging
#   python apps/pairing-server/devops/deploy.py staging --tag v0.3.0
#   python apps/pairing-server/devops/deploy.py staging --check --diff
#
# The image is the single self-contained artifact (backend + Caddy + baked-in
# mobile PWA at /app/mobile-dist); deployments upload nothing.

- name: Deploy dropvoice pairing-server
  hosts: all
  user: "{{ user }}"
  gather_facts: false

  tasks:
    - name: Load environment vault
      ansible.builtin.include_vars:
        file: "vars/{{ env }}/vault.yml"

    - name: Require --limit so a single environment is targeted
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: >-
          Refusing to run without --limit. Specify the environment explicitly,
          e.g. -l dev, to avoid deploying to every host at once.

    - name: Ensure application directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ app_dirs }}"

    - name: Template docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ compose_file }}"
        mode: "0644"

    - name: Template config.toml (application config → /app/config.toml)
      ansible.builtin.template:
        src: config.toml.j2
        dest: "{{ config_file }}"
        mode: "0644"

    - name: Copy Caddyfile (HTTP form, shared with image default + acceptance)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker/Caddyfile"
        dest: "{{ caddyfile }}"
        mode: "0644"
      when: tls_profile == 'http'

    - name: Template Caddyfile (TLS form, production only)
      ansible.builtin.template:
        src: Caddyfile.production.j2
        dest: "{{ caddyfile }}"
        mode: "0644"
      when: tls_profile == 'origin'

    - name: Pull image (daemon-level, honors insecure-registries)
      community.docker.docker_image:
        name: "{{ image }}"
        source: pull
        force_source: true
      register: image_pull
      changed_when: image_pull.changed

    - name: Recreate containers on change
      community.docker.docker_compose_v2:
        project_src: "{{ app_path }}"
        # pull: never — image is pre-pulled by docker_image above. Compose's own
        # registry manifest check speaks HTTPS only and fails against the plain-
        # HTTP LAN registry even when the daemon has it in insecure-registries.
        pull: never
        state: present
        remove_orphans: true

    # Post-deploy verification from the controller (not the container network):
    # compose's healthcheck only proves the in-container probe passes; this
    # also catches a broken published port, Caddy config, or edge path — and
    # the version check catches a healthy container still running an old image
    # (APP_VERSION is baked into the image at build time).
    - name: Record expected version from the deploying checkout
      ansible.builtin.command:
        cmd: git describe --tags --always --dirty
        chdir: "{{ playbook_dir }}/../../../../"
      delegate_to: localhost
      run_once: true
      register: controller_version
      changed_when: false
      when: not ansible_check_mode

    - name: Expected version is the pinned image tag (--tag / pinned env)
      ansible.builtin.set_fact:
        smoke_expected_version: "v{{ image_tag | regex_replace('^v', '') }}"
      when: not ansible_check_mode and image_tag is defined and image_tag != 'main'

    - name: Expected version is the deploying checkout (rolling main)
      ansible.builtin.set_fact:
        smoke_expected_version: "{{ controller_version.stdout }}"
      when: not ansible_check_mode and image_tag is defined and image_tag == 'main'

    - name: Verify deployment health and version (smoke)
      ansible.builtin.command:
        cmd: >-
          python3 {{ playbook_dir }}/../../../../scripts/smoke.py {{ public_url }}
          --expect-version {{ smoke_expected_version | default('') }}
      delegate_to: localhost
      run_once: true
      register: smoke_result
      changed_when: false
      until: smoke_result.rc == 0
      retries: 6
      delay: 10
      when: not ansible_check_mode
