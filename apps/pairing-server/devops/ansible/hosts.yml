---
# Inventory: operator-managed instances.
#
#   staging     — fn @ 192.168.5.200，生产形态自托管验证场（dogfooding）。
#                 HTTPS 由内网隧道在外部终止（dropvoice.bytehome.fun，运维操作，
#                 本项目不管理隧道本身）。
#   production  — 公共 SaaS（ttyo，alice @ 43.133.160.29）。Cloudflare 回源
#                 :443 → 宿主共享 Caddy 终结 TLS → 容器 127.0.0.1:8089（HTTP，
#                 markpost 模式；宿主站点块见 runbooks/production-cloudflare.md）。
#
# 本机开发验收不经过本 inventory：本机直接起 pairing-server + tauri dev +
# mobile dev，验收通过后再发布到 staging。
# per-host 事实（user、home）在 host_vars/<hostname>.yml。
#
# 注意：host 名与 group 名必须不同（staging 组内 host 叫 fn，多主机时用
# fn-2、fn-3 递增）。环境名仍用 group 名（-l staging / -l production），
# 与 deploy.py / deploy.yml 头部注释一致。

all:
  children:
    staging:
      hosts:
        fn:
          ansible_user: fn
          ansible_host: 192.168.5.200
          ansible_python_interpreter: /usr/bin/python3.11

    production:
      hosts:
        ttyo:
          ansible_user: alice
          ansible_host: 43.133.160.29
