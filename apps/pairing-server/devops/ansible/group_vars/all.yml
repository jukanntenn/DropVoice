---
# Shared variables for every dropvoice pairing-server environment. Per-environment
# overrides live in group_vars/<env>.yml; per-host facts (user, home) in host_vars/.
#
# These render into config.toml (template config.toml.j2 → /app/config.toml),
# docker-compose.yml and the Caddyfile on the target host.

app_name: dropvoice
apps_path: "{{ home }}/docker"
app_path: "{{ apps_path }}/{{ app_name }}"
compose_file: "{{ app_path }}/docker-compose.yml"
caddyfile: "{{ app_path }}/Caddyfile"
config_file: "{{ app_path }}/config.toml"

# Internal topology is identical across every environment:
#   - Rust axum backend listens loopback-only on 127.0.0.1:38424 (config.toml
#     listen_addr, never published).
#   - Caddy is the only published port, always the HTTP form (:8080 in every
#     environment); TLS is terminated upstream — staging: intranet tunnel,
#     production: the shared host Caddy on ttyo (Cloudflare reaches it on :443).
backend_port: 38424

# SQLite database file lives at /app/data/pairing.db in the app container,
# bind-mounted from the deployment dir's data/ subdirectory (not a named
# volume): compose + config + data + log form one plain directory tree, so
# backup is a single tar of the app dir (stop the container first for a
# consistent sqlite snapshot).
database_url: sqlite:///app/data/pairing.db?mode=rwc

# Directory skeleton created by the playbook before compose comes up — data/
# and log/ are bind mounts, so they must exist instead of being implicitly
# created root-owned by dockerd.
app_dirs:
  - "{{ apps_path }}"
  - "{{ app_path }}"
  - "{{ app_path }}/data"
  - "{{ app_path }}/log"

# Rate limit (requests per IP per second) rendered into config.toml.
rate_limit_per_sec: 1
