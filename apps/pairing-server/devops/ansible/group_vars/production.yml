---
# production — the public SaaS origin behind Cloudflare.
# Caddy serves HTTPS on 4443 with a Cloudflare Origin CA certificate; the
# visitor-facing edge port is 443 (terminated at Cloudflare), and an Origin Rule
# rewrites the destination port to 4443.

env: production
image_tag: latest
image: "dropvoice/pairing-server:{{ image_tag }}"

public_url: "https://api.dropvoice.app"
trusted_proxies: '["127.0.0.1", "::1"]'

host_port: 4443
caddy_port: 4443
tls_profile: origin
caddyfile_template: Caddyfile.production.j2

debug: false

# Cloudflare CIDR ranges for Caddy trusted_proxies. Sync from
# https://www.cloudflare.com/ips/ (IPv4 + IPv6, space-separated).
cloudflare_cidrs: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22"

# 桌面 webview 跨域直连信令服务器（§10.5 盲区补充）。PWA 与 API 同域无 CORS。
cors_origins: 'http://tauri.localhost,tauri://localhost'

app_dirs:
  - "{{ apps_path }}"
  - "{{ app_path }}"
  - "{{ app_path }}/certs"
  - "{{ app_path }}/mobile-dist"
