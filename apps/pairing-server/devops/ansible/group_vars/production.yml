---
# production — the public SaaS origin (ttyo @ 43.133.160.29) behind Cloudflare.
# Topology (D 方案，无 UA 嗅探——确定性路由，一个 URL 恒定一个内容):
#   dropvoice.online        landing（营销页；桌面/移动统一入口，CF 边缘发静态）
#   app.dropvoice.online    手机 PWA + /api 同源反代（PWA 与 API 恒同源）
#   ps.dropvoice.online     纯 API + /health（桌面心跳/SSE）
# 流量链（markpost 模式，与 ttyo 既有服务一致）: Cloudflare 回源 ttyo:443 →
# 宿主共享 Caddy（Origin CA 证书终结 TLS，按主机名反代）→ 容器 127.0.0.1:8089
# （仅回环发布，HTTP）→ 容器内 Caddy 三站点分流 → axum。宿主 Caddy 站点块是
# 运维侧配置（runbooks/production-cloudflare.md §2），不由本 playbook 管理。
# 前置条件（CF 面板一次性）：三条橙云记录 → VPS、Full (strict)（回源 443，
# 无 Origin Rule 端口改写）、限流/WAF/Cache 规则。

env: production
# Pinned release (docker tag, no leading v). Bump on promotion after the human
# acceptance gate (devops/runbooks/accept-staging.md). CI publishes version
# tags + latest to ghcr.io (.github/workflows/docker-publish.yml); prod pulls
# the ghcr image anonymously (the package is public in GitHub package settings;
# no registry login on the VPS).
expected_version: "0.1.0"
image_tag: "{{ expected_version }}"
registry: "ghcr.io/jukanntenn"
image: "{{ registry }}/dropvoice-pairing-server:{{ image_tag }}"

# 三域名。
landing_domain: dropvoice.online
app_domain: app.dropvoice.online
api_domain: ps.dropvoice.online

# Smoke 入口（landing 域名；smoke.py 会同时探测 app/ps 两个域）。
public_url: "https://{{ landing_domain }}"

# 宿主发布端口：仅回环——宿主共享 Caddy 是唯一入口，外网无法直连容器。
# 8089 如与 ttyo 既有回环端口冲突，换成任意空闲端口并同步宿主 Caddy 站点块。
host_port: "127.0.0.1:8089"
caddy_port: 8080

# 上游可信代理段：宿主 Caddy → 容器的连接源是 docker 网桥网关（真实客户端
# IP 已由宿主 Caddy 从 CF-Connecting-IP 写入 XFF）。TODO(ops)：首次部署后按
# 实际网关 IP 收窄为单个 /32。
trusted_proxies_cidrs: "172.16.0.0/12 127.0.0.1/8 ::1/128"

debug: false

# CORS：webview 已是纯视图（信令全在 Rust 进程），手机 PWA 同源——生产形态
# 无跨域需求，留空。
cors_extra_origins: []
