---
# production — the public SaaS origin behind Cloudflare (dropvoice.online).
# Topology (D 方案，无 UA 嗅探——确定性路由，一个 URL 恒定一个内容):
#   dropvoice.online        landing（营销页；桌面/移动统一入口，CF 边缘发静态）
#   app.dropvoice.online    手机 PWA + /api 同源反代（PWA 与 API 恒同源）
#   ps.dropvoice.online     纯 API + /health（桌面心跳/SSE）
# Caddy serves HTTPS on 4443 with a Cloudflare Origin CA certificate (SAN:
# dropvoice.online + *.dropvoice.online); visitor-facing edge port is 443,
# and a Cloudflare Origin Rule rewrites the destination port to 4443.
# 前置条件（CF 面板一次性）：三条橙云记录 → VPS、Full (strict)、Origin Rule
# 端口改写、AOP（Caddy client_auth 由镜像/模板提供）、限流/WAF/Cache 规则。

env: production
# Pinned release (docker tag, no leading v). Bump on promotion after the human
# acceptance gate (devops/runbooks/accept-staging.md). CI publishes version
# tags + latest to both ghcr.io and Docker Hub (.github/workflows/docker-publish.yml);
# prod pulls from Docker Hub (public image, no registry login on the VPS).
expected_version: "0.1.3"
image_tag: "{{ expected_version }}"
registry: "docker.io/jukanntenn"
image: "{{ registry }}/dropvoice-pairing-server:{{ image_tag }}"

# 三域名。
landing_domain: dropvoice.online
app_domain: app.dropvoice.online
api_domain: ps.dropvoice.online

# Smoke 入口（landing 域名；smoke.py 会同时探测 app/ps 两个域）。
public_url: "https://{{ landing_domain }}"

host_port: 4443
caddy_port: 4443
tls_profile: origin

# Cloudflare 上游段（Caddy trusted_proxies + strict；真实 IP 链见 Caddyfile.j2
# 头注）。Source: https://www.cloudflare.com/ips/ — sync when Cloudflare updates.
trusted_proxies_cidrs: "173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22"

debug: false

# CORS：webview 已是纯视图（信令全在 Rust 进程），手机 PWA 同源——生产形态
# 无跨域需求，留空。
cors_extra_origins: []

app_dirs:
  - "{{ apps_path }}"
  - "{{ app_path }}"
  - "{{ app_path }}/certs"
