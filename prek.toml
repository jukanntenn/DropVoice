# prek configuration — workspace root.
# Docs: https://prek.j178.dev/
#
# prek discovers every prek.toml in the repo and runs them as one workspace;
# each child config's hooks run with cwd at that directory and receive
# project-relative paths:
#   - apps/desktop/prek.toml             TS frontend (src/) + Tauri Rust (src-tauri/)
#   - apps/mobile/prek.toml              TS PWA
#   - apps/pairing-server/prek.toml      Rust + OpenAPI drift gate
#   - packages/{core,i18n,ui}/prek.toml  TS packages
# Root builtins below still cover the whole tree (children are not orphan).
#
# Single source of truth for the whole quality pipeline: AI post-edit hooks run
# `prek run --group format --files <edited>`, AI Stop runs `prek run --group
# lint --all-files`, commit runs the pre-commit stage, push runs the pre-push
# stage (tests), CI runs `prek run --all-files` + `prek run --stage pre-push
# --all-files`. No parallel formatter/lint definition exists outside prek.
#
# Hook groups (orthogonal to stages):
#   format — mutating fixers, auto-fix wherever the tool supports it
#   lint   — read-only gates (oxlint / tsc / clippy)
#   check  — structural checks, generated-file drift, lockfile freshness, tests
#
# Install: prek install

minimum_prek_version = "0.4.0"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]

# Generated/lock files whose bytes belong to a generator or a package manager:
# every mutating hook must exempt them (a fixer diverging from raw generator
# output would trip the drift gates below). The regex is inlined per hook
# because prek does not support config-level variable interpolation.
#   packages/ui/src/tokens/theme.css               <- pnpm design:sync (DESIGN.md)
#   apps/pairing-server/docs/openapi.{json,yaml}   <- gen-openapi (utoipa)
#   Cargo.lock / pnpm-lock.yaml                    <- package managers only

# ---- check group: read-only builtin gates (whole tree) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "check-yaml", groups = ["check"], stages = ["pre-commit"] },
  { id = "check-toml", groups = ["check"], stages = ["pre-commit"] },
  { id = "check-json", groups = ["check"], stages = ["pre-commit"] },
  { id = "check-merge-conflict", groups = ["check"], stages = ["pre-commit"] },
  { id = "check-added-large-files", groups = ["check"], stages = ["pre-commit"] },
  { id = "detect-private-key", groups = ["check"], stages = ["pre-commit"] },
]

# ---- format group: builtin fixers (whole tree, generated files exempt) ----
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "^packages/ui/src/tokens/theme\\.css$|^apps/pairing-server/docs/openapi\\.(json|yaml)$|^Cargo\\.lock$|^pnpm-lock\\.yaml$", groups = ["format"], stages = ["pre-commit"] },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^packages/ui/src/tokens/theme\\.css$|^apps/pairing-server/docs/openapi\\.(json|yaml)$|^Cargo\\.lock$|^pnpm-lock\\.yaml$", groups = ["format"], stages = ["pre-commit"] },
  { id = "end-of-file-fixer", exclude = "^packages/ui/src/tokens/theme\\.css$|^apps/pairing-server/docs/openapi\\.(json|yaml)$|^Cargo\\.lock$|^pnpm-lock\\.yaml$", groups = ["format"], stages = ["pre-commit"] },
]

# ---- GitHub Actions workflow lint ----
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint", groups = ["check"], stages = ["pre-commit"] }]

[[repos]]
repo = "local"

# ---- format group: repo-level formatters (apps/ and packages/ own their files) ----
# `.agents/` content (dv-rfcs records, skills) is real hand-written material and IS
# formatted; only the per-tool adapter dirs stay exempt. Wholesale-excluding
# `.agents/` once let gates pass green over real content — do not reintroduce it.
[[repos.hooks]]
id = "prettier-root"
name = "prettier (root, non-app files)"
language = "system"
entry = "pnpm exec prettier --write"
files = "\\.(ts|tsx|js|jsx|json|css|md|ya?ml|html)$"
exclude = "^(apps|packages)/|^(\\.claude|\\.codex|\\.opencode|\\.zcode)/|^packages/ui/src/tokens/theme\\.css$|^Cargo\\.lock$|^pnpm-lock\\.yaml$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: repo-level lint (e2e + scripts TS/JS) ----
[[repos.hooks]]
id = "oxlint-root"
name = "oxlint (e2e + scripts)"
language = "system"
entry = "pnpm exec oxlint"
files = "^(e2e|scripts)/.*\\.(ts|tsx|js|jsx)$"
pass_filenames = true
groups = ["lint"]
stages = ["pre-commit"]

# ---- check group: generated-file + sync gates ----

# AGENTS.md == CLAUDE.md at every level (byte-for-byte) + .claude/skills mirrors
# .agents/skills; fix: python scripts/sync_agent_files.py
[[repos.hooks]]
id = "agents-sync"
name = "AI tool configs in sync"
language = "system"
entry = "python scripts/sync-agents.py"
files = "(^|/)(AGENTS|CLAUDE)\\.md$|^\\.agents/skills/|^\\.claude/skills/"
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# DESIGN.md tokens -> packages/ui/src/tokens/theme.css; fix: pnpm design:sync
[[repos.hooks]]
id = "design-sync"
name = "design tokens up to date"
language = "system"
entry = "python scripts/check_design_sync.py"
files = "^DESIGN\\.md$"
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# DESIGN.md must itself lint clean.
[[repos.hooks]]
id = "design-lint"
name = "DESIGN.md lint"
language = "system"
entry = "pnpm design:lint"
files = "^DESIGN\\.md$"
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# Lock files must match their manifests; fix: pnpm install --lockfile-only,
# then any cargo command refreshes Cargo.lock; commit both.
[[repos.hooks]]
id = "lockfiles-fresh"
name = "lock files up to date"
language = "system"
entry = "python scripts/check_lockfiles.py"
files = "(package\\.json|pnpm-workspace\\.yaml|Cargo\\.toml|Cargo\\.lock|pnpm-lock\\.yaml)$"
pass_filenames = false
groups = ["check"]
stages = ["pre-commit"]

# Markdown documentation gates (dv-rfcs format, doc pairs, budgets, links).
# Fix: edit the doc (fix the doc, not the gate); mirrors are rebuilt by
# `python scripts/sync_agent_files.py`. `.claude/skills` is a byte copy of
# `.agents/skills` (checked at the source); the four tool dirs are adapters.
[[repos.hooks]]
id = "doc-check"
name = "documentation gates"
language = "system"
entry = "python scripts/doc_sync.py"
files = "\\.md$"
exclude = "^\\.claude/|^\\.codex/|^\\.opencode/|^\\.zcode/"
pass_filenames = true
groups = ["check"]
stages = ["pre-commit"]

# ---- commit-msg: Conventional Commits ----
[[repos.hooks]]
id = "commitlint"
name = "commit message format"
language = "system"
entry = "pnpm commitlint --edit"
pass_filenames = true
groups = ["check"]
stages = ["commit-msg"]
