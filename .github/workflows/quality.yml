name: Quality Checks

# Single source of truth: every check CI runs is declared in prek (prek.toml +
# apps/*/prek.toml + packages/*/prek.toml). CI just installs the toolchains
# prek's hooks call (pnpm, rust, python) and runs prek — no parallel
# lint/format definition exists here. The only direct-tool jobs are the
# desktop Rust OS matrix (platform-specific coverage prek's ubuntu job cannot
# subsume) and the Playwright e2e job (needs a browser install).

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
            frontend:
              - 'apps/desktop/src/**'
              - 'apps/mobile/**'
              - 'packages/**'
              - 'e2e/**'

  quality:
    name: prek (format + lint + gates + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/pairing-server
      - name: Install Linux dependencies
        # clippy on the desktop crate links glib/gtk/webkit (tauri's linux
        # backend); without the -dev packages glib-sys's build script fails.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - name: Validate prek configs
        run: uvx prek@0.4.12 validate-config prek.toml apps/*/prek.toml packages/*/prek.toml
      - name: prek run --all-files (format + lint + gates)
        # Formatters mutate; prek exits non-zero if any file needed formatting
        # or any lint/gate failed — the comprehensive single-source gate.
        run: uvx prek@0.4.12 run --all-files
      - name: prek run --stage pre-push --all-files (tests)
        run: uvx prek@0.4.12 run --stage pre-push --all-files

  desktop-rust:
    name: Desktop Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Format
        run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: Test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
