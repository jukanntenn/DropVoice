name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      # Fully qualified, never a relative path: a relative reference would
      # load the action from the pull request's merge ref, letting a pull
      # request modify its own validator.
      - name: Validate the pull request
        uses: jukanntenn/harness-deepseek-harness/.github/actions/issue-policy@ac46ba7e1e6413d72c2b78026f55693ce8f4e5b8
        with:
          project-token: ${{ secrets.HDSH_ISSUE_PROJECT_TOKEN }}
          hdsh-ref: ac46ba7e1e6413d72c2b78026f55693ce8f4e5b8
