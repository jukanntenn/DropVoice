name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows
            # NSIS only: WiX/MSI cannot represent prerelease semver
            # (numeric-only parts <= 65535) and has no updater path.
            args: '--bundles nsis'

          - platform: macos-14
            target: macos
            # `app` is not optional: the macOS updater artifacts (.app.tar.gz
            # + .sig) are produced by the `app` bundle target — `dmg` alone
            # makes the bundler warn "no updater-enabled targets were built"
            # and ship no darwin entry in latest.json (bit us on rc.1).
            args: '--target universal-apple-darwin --bundles app dmg'

          - platform: ubuntu-22.04
            target: linux
            args: '--bundles appimage deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev

      - run: pnpm install --frozen-lockfile

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Monorepo: the tauri CLI lives in apps/desktop's devDependencies,
          # so the action must run there — at the workspace root `pnpm tauri`
          # resolves to nothing.
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign — the updater's own chain).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple/Windows codesigning envs stay ABSENT until certificates
          # exist: a present-but-empty APPLE_CERTIFICATE makes tauri-bundler
          # attempt a keychain import and fail. macOS falls back to ad-hoc
          # signing; Windows ships unsigned (SmartScreen warning).

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # action-gh-release@v2 dropped the release_id input; un-draft explicitly
      # via gh (the draft was created against this tag by create-release).
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this job — tell gh the repo explicitly instead of
        # letting it sniff for a git directory that isn't there.
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "$GITHUB_REPOSITORY"

  publish-r2:
    # Desktop updater distribution (releases.dropvoice.online, Cloudflare R2):
    # rewrite tauri-action's latest.json platform URLs to the R2 domain and
    # upload the signed artifacts + manifest. Stable tags only — prereleases
    # never move the manifest shipped installers poll (same rule as the docker
    # `latest` tag in docker-publish.yml). Requires secret
    # CLOUDFLARE_API_TOKEN (Account -> R2 -> Edit).
    needs: [build, publish]
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --dir dist --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish updater artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          python scripts/publish_updater_manifest.py
          --release-dir dist --tag "$GITHUB_REF_NAME"
          --base-url https://releases.dropvoice.online
