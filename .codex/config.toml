# Codex CLI configuration.
# Docs: https://learn.chatgpt.com/docs/config-file/config-reference
# Hooks are thin adapters over prek (see prek.toml at the repo root):
#   PostToolUse -> prek run --group format --files <edited>
#   Stop        -> prek run --group lint --all-files (block on failure)

[features]
hooks = true

# --- PostToolUse: format the edited file via prek ---
[[hooks.PostToolUse]]
matcher = "Edit|Write|ApplyPatch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 .codex/hooks/post_tool_use.py"
command_windows = "python .codex/hooks/post_tool_use.py"
timeout = 120

# --- Stop: lint all files via prek before ending ---
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 .codex/hooks/stop.py"
command_windows = "python .codex/hooks/stop.py"
timeout = 240
