# Ansible configuration — at the repo root so playbooks run from the root with
# no -i flags:
#   ansible-playbook apps/pairing-server/devops/ansible/deploy.yml -l staging
# On Windows use the dockerized runner instead (same command, in a container):
#   python apps/pairing-server/devops/deploy.py staging
# Both run with the repo root as cwd, so this file is discovered automatically.

[defaults]
inventory = apps/pairing-server/devops/ansible/hosts.yml
callback_result_format = yaml
callback_result_indentation = 2
# Targets are operator-managed instances: auto-accept fingerprints on first
# connect (the dockerized runner has no known_hosts at all).
host_key_checking = False
timeout = 30
# Never drop .retry files into the (mounted) repo working tree.
retry_files_enabled = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
