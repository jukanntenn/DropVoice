# packages/i18n — i18next locales + TS. Workspace mode runs these hooks with
# cwd=packages/i18n and strips the packages/i18n/ prefix (locales/**/*.json
# included in prettier scope). Root builtins still cover these files.

[[repos]]
repo = "local"

# ---- format group: mutating fixers ----
[[repos.hooks]]
id = "prettier"
name = "prettier (i18n)"
language = "system"
entry = "pnpm exec prettier --write"
files = "\\.(ts|tsx|js|jsx|json|css|html)$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "oxlint-fix"
name = "oxlint --fix (i18n)"
language = "system"
entry = "pnpm exec oxlint --fix"
files = "\\.(ts|tsx|js|jsx)$"
pass_filenames = true
groups = ["format"]
stages = ["pre-commit"]

# ---- lint group: read-only gates ----
[[repos.hooks]]
id = "oxlint"
name = "oxlint (i18n)"
language = "system"
entry = "pnpm exec oxlint"
files = "\\.(ts|tsx|js|jsx)$"
pass_filenames = true
groups = ["lint"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "typecheck"
name = "tsc --noEmit (i18n)"
language = "system"
entry = "pnpm typecheck"
files = "\\.(ts|tsx)$"
pass_filenames = false
groups = ["lint"]
stages = ["pre-commit"]

# ---- check group: tests (pre-push) ----
[[repos.hooks]]
id = "vitest"
name = "vitest (i18n)"
language = "system"
entry = "pnpm test"
files = "\\.(ts|tsx)$"
pass_filenames = false
groups = ["check"]
stages = ["pre-push"]
