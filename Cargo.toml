[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/pairing-server",
]

# 中央依赖版本对齐（spec 11 §12.3 技术栈）。
# 各成员 crate 通过 `dep.workspace = true` 继承，避免版本漂移。
[workspace.package]
version = "0.1.0-rc.2"
edition = "2021"
# MSRV：与 CI stable（当前 1.93）对齐。clippy 自动读取此字段，无需在 clippy.toml
# 重复声明 msrv。升级 sqlx 至 0.9 时需同步提升至 1.94+。
rust-version = "1.93"
license = "MIT"
authors = ["DropVoice"]

[workspace.dependencies]
# 异步运行时与 Web 框架
tokio = { version = "1", features = ["full"] }
# axum 0.8：pairing-server（信令 + SSE）。
axum = { version = "0.8", features = [] }
# tower-http：trace（请求日志）+ cors（pairing-server dev CORS）。
tower-http = { version = "0.7", features = ["trace", "cors"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TOML 配置文件（可选 CONFIG_PATH；docker/compose.local 挂载 config.local.toml）
toml = "0.8"

# 日志 / 可观测性（spec 16）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
# log→tracing 桥：enigo 等第三方 crate 用 `log` crate 打的 warning 得以浮现。
tracing-log = "0.2"

# 错误处理
thiserror = "2"
anyhow = "1"

# 数据库（配对服务器专用）
# 注：spec 11 §12.3 目标为 sqlx 0.9；当前构建工具链 rustc 1.93 暂用 0.8，
# 升级工具链至 1.94+ 后切回 0.9（API 兼容）。
# sqlx 0.8 的 `sqlite` feature 已隐含 `sqlx-sqlite/bundled`，libsqlite3 从源码静态
# 链接进 binary，容器运行时无需系统 libsqlite3（spec 11 §12.3）。
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# 工具
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
directories = "6"
# token 落库哈希（pairing-server 凭据模型：DB 泄露 ≠ token 泄露）。
sha2 = "0.10"
# base64：dvct_ 连接令牌编码（§3.3，URL_SAFE_NO_PAD 32 字节）。
base64 = "0.22"

# 跨平台网络
local-ip-address = "0.6"
socket2 = "0.6"

# 流处理（pairing-server SSE 事件流；desktop SSE 订阅流）
tokio-stream = "0.1"
futures-util = "0.3"
# SSE 解析：reqwest bytes_stream → 事件流（desktop 信令订阅）。
eventsource-stream = "0.2"
bytes = "1"
# 原生 WebRTC（desktop 应答面）：纯 Rust 实现，ICE/DTLS/SCTP DataChannel，
# 与进程同生命周期 —— webview 冻结/挂起不再影响信令与数据面。
webrtc = "0.17"

# OpenAPI 文档（pairing-server 专用；preserve_order* 保证生成物字节级确定性）
# yaml feature：5.5.x 内部 serde_norway，5.6.0 起切换为 yaml_serde（API 不变）。
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "yaml", "preserve_order", "preserve_path_order"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# HTTP 客户端（desktop 心跳/信令 + 测试）；stream feature 供 SSE 字节流。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tempfile = "3"

# 集中 release profile（workspace 根定义，成员 crate 不再单独声明）。
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
